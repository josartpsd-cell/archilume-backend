services:
  - type: web
    name: archilume-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3900
      - key: ADMIN_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
